name: Tag a release

# Creates the release tag v<world_version> (optionally with a suffix) on the commit this workflow is run on, and
# publishes the GitHub release for it.
#
# Run it from the Actions tab: choose the branch to release, optionally enter a suffix such as rc.1, and start it.
# The version always comes from worlds/medabots_rpg/archipelago.json, so the tag can never disagree with the world.
# Nothing is tagged unless the version has a CHANGELOG.md section, lint and tests pass, and the tag does not exist yet.
#
# Why the release is called from here: a tag pushed with the built-in GITHUB_TOKEN does not start other workflows, so
# release.yml's own "on push of a tag" trigger would never fire. Calling it directly needs no personal access token.

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "Pre-release suffix, e.g. rc.1 (tag becomes v<version>-rc.1). Leave empty for the plain version."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Only check everything and report the tag that would be created"
        required: false
        type: boolean
        default: false
      publish:
        description: "Also build and publish the GitHub release after tagging"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Work out the tag
        id: tag
        env:
          SUFFIX: ${{ inputs.suffix }}
        run: python tools/release_notes.py --derive-tag --suffix "$SUFFIX" | tee -a "$GITHUB_OUTPUT"

      - name: Make sure the tag does not exist yet
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists. Raise world_version in archipelago.json (and add a changelog section), or use a different suffix."
            exit 1
          fi

      - name: Check the changelog and release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/release_notes.py --tag "$TAG" --notes-out /dev/null | tee -a "$GITHUB_OUTPUT"

      - name: Lint
        run: tools/dev.sh lint

      - name: Test
        run: tools/dev.sh test

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release check passed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) |"
            echo "| Pre-release | $PRERELEASE |"
            if [ "$DRY_RUN" = "true" ]; then
              echo
              echo "Dry run: nothing was tagged or published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Create and push the tag
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the tag
    steps:
      - uses: actions/checkout@v4
      - name: Create the annotated tag and push it
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Medabots RPG $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the release
    needs: [verify, tag]
    if: ${{ !inputs.dry_run && inputs.publish }}
    permissions:
      contents: write # the called workflow creates the release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      skip_checks: true # lint and tests already passed on this very commit in the verify job
